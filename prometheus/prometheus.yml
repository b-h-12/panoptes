global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "node"
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/node.json"
        refresh_interval: 30s
