name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cli, ntfy-adapter]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Format check
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
